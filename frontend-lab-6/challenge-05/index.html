<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenge 5–6 — Container Query card</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="content-layout">
  <aside class="sidebar">
    <div class="card-wrapper">
      <article class="product-card">
        <img src="../img/product.svg" alt="" width="320" height="240">
        <div class="product-card__body">
          <h2 class="product-card__title">Wireless headphones</h2>
          <p>Noise cancelling, 30 hours of battery life, USB-C charging.</p>
          <p class="product-card__price">$129</p>
          <button>Add to cart</button>
        </div>
      </article>
    </div>
  </aside>

  <main>
    <div class="card-wrapper">
      <article class="product-card">
        <img src="../img/product.svg" alt="" width="320" height="240">
        <div class="product-card__body">
          <h2 class="product-card__title">Wireless headphones</h2>
          <p>Noise cancelling, 30 hours of battery life, USB-C charging.</p>
          <p class="product-card__price">$129</p>
          <button>Add to cart</button>
        </div>
      </article>
    </div>
  </main>
</div>

<!-- Modal-like container: третє місце для тієї самої картки. -->
<div class="modal">
  <div class="card-wrapper">
    <article class="product-card">
      <img src="../img/product.svg" alt="" width="320" height="240">
      <div class="product-card__body">
        <h2 class="product-card__title">Wireless headphones</h2>
        <p>Noise cancelling, 30 hours of battery life, USB-C charging.</p>
        <p class="product-card__price">$129</p>
        <button>Add to cart</button>
      </div>
    </article>
  </div>
</div>
</body>
</html>
