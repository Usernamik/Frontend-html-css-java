name: Deploy labs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          for dir in frontend*/; do
            cp -r "$dir" "_site/$dir"
          done
          {
            echo '<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>Лабораторні</title></head><body><h1>Лабораторні роботи</h1><ul>'
            for dir in frontend*/; do
              name="${dir%/}"
              echo "<li><a href=\"$name/\">$name</a></li>"
            done
            echo '</ul></body></html>'
          } > _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
